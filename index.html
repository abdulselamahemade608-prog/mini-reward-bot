<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Adewa Eran</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{
  --bg:#0e1120;--card:#171b30;--card2:#1e2340;--line:#2a3052;--txt:#eef0fa;--mut:#8f97bd;
  --acc:#6c7bff;--acc2:#a45cff;--ok:#2ecc8f;--bad:#ff5b6e;--warn:#ffb648;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:var(--safe-t)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.hname{flex:1;min-width:0}
.hname b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname small{color:var(--mut)}
.pill{background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.iconbtn{background:var(--card2);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
main{flex:1;padding:4px 14px calc(88px + var(--safe-b))}
nav{position:fixed;left:0;right:0;bottom:0;background:#12162a;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:6}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mut);font-size:11px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--txt)}
nav button.on i{filter:drop-shadow(0 0 6px var(--acc))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px}
.hero{background:linear-gradient(135deg,#3b46c9,#8a4bd8);border:0}
.hero small{opacity:.8}
.big{font-size:34px;font-weight:800;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;color:#fff}
.btn.full{width:100%}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#06251a}
.btn.bad{background:var(--bad)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:4px 0;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
label{display:block;font-size:12.5px;color:var(--mut);margin-top:8px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2)}
.tag.ok{background:#12372b;color:var(--ok)}.tag.bad{background:#3d1a22;color:var(--bad)}.tag.warn{background:#3d2f12;color:var(--warn)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.rk{width:30px;text-align:center;font-weight:800;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 13px;color:var(--mut);cursor:pointer;font-size:13px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.center{text-align:center;padding:60px 20px}
.center .em{font-size:54px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r 0.8s linear infinite;margin:30px auto}
@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-90px);background:#222849;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;text-align:center;transition:transform .25s}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--ok)}#toast.err{border-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(5,7,15,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .card{width:100%;max-width:400px;margin:0}
.slot{font-size:46px;text-align:center;padding:8px 0;font-weight:800}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:19px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ============================ BASICS ============================ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0e1120"); tg.setBackgroundColor("#0e1120"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n, d = 2) => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: d });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);

const deviceId = (() => {
  try {
    let d = localStorage.getItem("dev_id");
    if (!d) { d = uid(); localStorage.setItem("dev_id", d); }
    return d;
  } catch (e) { return uid(); }
})();

function toast(msg, type) {
  const t = $("#toast");
  t.className = "show " + (type || "");
  t.textContent = msg;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.className = ""; }, 3200);
}
function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }

async function api(path, body, method) {
  const init = { method: method || (body !== undefined ? "POST" : "GET"), headers: { "x-telegram-init-data": (tg && tg.initData) || "", "x-device": deviceId } };
  if (body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  try {
    const r = await fetch("/api" + path, init);
    const j = await r.json().catch(() => ({ ok: false, error: "Bad server reply." }));
    j.httpStatus = r.status;
    return j;
  } catch (e) {
    return { ok: false, error: "Network error. Check your connection." };
  }
}

function openLink(url) {
  if (!url) return;
  if (/^https?:\/\/t\.me\//i.test(url) && tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else if (tg && tg.openLink) tg.openLink(url);
  else window.open(url, "_blank");
}
function confirmBox(msg) {
  return new Promise(res => {
    if (tg && tg.showConfirm) tg.showConfirm(msg, ok => res(!!ok));
    else res(window.confirm(msg));
  });
}
function nameOf(u) {
  if (!u) return "User";
  return [u.first_name, u.last_name].filter(Boolean).join(" ") || (u.username ? "@" + u.username : "User " + (u.telegram_id || ""));
}
function avatar(u) {
  const n = nameOf(u);
  return `<div class="av">${u && u.photo_url ? `<img src="${esc(u.photo_url)}" onerror="this.remove()">` : esc(n.charAt(0).toUpperCase())}</div>`;
}
function fmtDate(v) {
  if (!v) return "";
  const d = new Date(v);
  return isNaN(d) ? "" : d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
}
function fmtWait(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`;
}
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };

/* ============================ STATE ============================ */
const S = {
  tab: "home", adminTab: "stats", d: {}, busy: {},
  me: null, auto: false, autoTimer: null, adLock: false
};
const settings = () => (S.me && S.me.settings) || {};
const user = () => (S.me && S.me.user) || {};
const pointUsd = () => { const v = settings().point_value_usd; return Number.isFinite(v) ? v : 0.01; };

/* ============================ BOOT ============================ */
async function boot() {
  const app = $("#app");
  if (!tg || !tg.initData) {
    app.innerHTML = `<div class="center"><div class="em">📱</div><h2>Open inside Telegram</h2><p class="mut">Please open this app from the bot in Telegram.</p></div>`;
    return;
  }
  app.innerHTML = `<div class="spin"></div>`;
  const r = await api("/me");
  if (r.status === "banned" || r.httpStatus === 403) {
    app.innerHTML = `<div class="center"><div class="em">🚫</div><h2>Access blocked</h2><p class="mut">${esc(r.error || "Your account is banned.")}</p></div>`;
    return;
  }
  if (!r.ok) {
    app.innerHTML = `<div class="center"><div class="em">⚠️</div><h2>Something went wrong</h2><p class="mut">${esc(r.error || "Try again.")}</p><button class="btn" onclick="boot()">Retry</button></div>`;
    return;
  }
  S.me = r;
  if (!r.allJoined) return renderGate();
  renderShell();
  go(S.tab);
}

function renderGate() {
  const list = (S.me.channels || []).map(c => {
    const isName = /^@/.test(c.channel);
    return `<div class="item"><div class="sp"><b>${esc(c.channel)}</b></div>
      ${c.joined ? `<span class="tag ok">Joined</span>` : (isName ? `<button class="btn small" data-a="openLink" data-v="https://t.me/${esc(c.channel.slice(1))}">Join</button>` : `<span class="tag warn">Join</span>`)}</div>`;
  }).join("");
  $("#app").innerHTML = `<div style="padding:20px"><div class="center" style="padding:20px"><div class="em">📢</div><h2>Join our channels</h2><p class="mut">Join all channels below to start earning.</p></div>
    <div class="card">${list}</div><button class="btn full" data-a="recheck">I joined, check again</button></div>`;
}

function renderShell() {
  const u = user();
  const navItems = [["home", "🏠", "Home"], ["earn", "🎯", "Earn"], ["friends", "👥", "Friends"], ["wallet", "💳", "Wallet"], ["top", "🏆", "Top"]];
  $("#app").innerHTML = `
    <header>${avatar(u)}<div class="hname"><b>${esc(nameOf(u))}</b><small>Rank #${num(u.rank, 0)}</small></div>
      <div class="pill" id="pts">💰 ${num(u.points)}</div>
      ${u.is_admin ? `<button class="iconbtn" data-a="tab" data-v="admin">⚙️</button>` : ""}
    </header>
    <main id="view"></main>
    <nav><div>${navItems.map(n => `<button data-a="tab" data-v="${n[0]}" id="nav-${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join("")}</div></nav>`;
}
function setPoints(p) {
  if (p !== undefined && p !== null) S.me.user.points = Number(p);
  const e = $("#pts"); if (e) e.textContent = "💰 " + num(user().points);
}

/* ============================ ROUTER ============================ */
const loaders = {};
const views = {};
function go(tab) {
  S.tab = tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.id === "nav-" + tab));
  render();
  if (loaders[tab]) loaders[tab]();
  window.scrollTo(0, 0);
}
function render() {
  const v = $("#view"); if (!v) return;
  const scroll = window.scrollY;
  v.innerHTML = (views[S.tab] ? views[S.tab]() : "");
  window.scrollTo(0, scroll);
}
async function reloadMe() {
  const r = await api("/me");
  if (r.ok) { S.me = r; setPoints(); }
  return r;
}

/* ============================ ACTIONS (event delegation) ============================ */
const A = {};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset.v, el, e);
});
A.tab = v => go(v);
A.openLink = v => openLink(v);
A.recheck = async () => { await boot(); };
A.closeModal = () => { const m = $(".modal"); if (m) m.remove(); };
function modal(html) {
  A.closeModal();
  const d = document.createElement("div");
  d.className = "modal";
  d.innerHTML = `<div class="card">${html}</div>`;
  d.addEventListener("click", e => { if (e.target === d) d.remove(); });
  document.body.appendChild(d);
}
async function lock(key, fn) {
  if (S.busy[key]) return;
  S.busy[key] = true;
  try { return await fn(); } finally { S.busy[key] = false; }
}

/* ============================ HOME ============================ */
loaders.home = async () => {
  const [b, p, sp] = await Promise.all([api("/banners"), api("/proof-feed"), api("/spin")]);
  S.d.banners = b.ok ? b.banners : [];
  S.d.feed = p.ok ? p.feed : [];
  S.d.spin = sp.ok ? sp : null;
  if (S.tab === "home") render();
};
views.home = () => {
  const st = settings(), u = user();
  const max = st.max_ads_per_day || 0, today = S.me.today_ads || 0;
  const pct = max ? Math.min(100, Math.round(today / max * 100)) : 0;
  const full = max > 0 && today >= max;
  const rew = st.ad_reward != null ? st.ad_reward : 1;
  const banners = (S.d.banners || []).map(b => `<div class="card row" data-a="banner" data-v="${b.id}" data-u="${esc(b.url)}" style="cursor:pointer">
      <div class="sp"><b>${esc(b.title)}</b><div class="sm mut">${esc(b.text || "")}</div></div><span class="tag warn">Ad</span></div>`).join("");
  const sp = S.d.spin;
  const feed = (S.d.feed || []).slice(0, 6).map(f => `<div class="item"><div class="sp"><b>${esc(f.name)}</b> <span class="mut sm">withdrew</span></div><span class="tag ok">$${num(f.usd, 2)}</span></div>`).join("");
  return `
    <div class="card hero"><small>Your balance</small><div class="big">${num(u.points)}</div>
      <small>≈ $${num(u.points * pointUsd(), 2)} ${esc((S.me.payout || {}).symbol || "USDT")}</small></div>
    ${banners}
    <div class="card"><div class="row"><h3 class="sp">Watch ads and earn</h3><span class="tag">${today} / ${max || "∞"}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div style="height:10px"></div>
      <div class="grid2">
        <button class="btn" data-a="watch" data-v="adsgram" ${full ? "disabled" : ""}>▶ Ad 1<br><small>+${num(rew)} pts</small></button>
        <button class="btn" data-a="watch" data-v="monetag" ${full ? "disabled" : ""}>▶ Ad 2<br><small>+${num(rew)} pts</small></button>
      </div>
      ${st.auto_ad_seconds > 0 ? `<button class="btn ghost full" style="margin-top:8px" data-a="auto">${S.auto ? "⏸ Stop auto watch" : "⏯ Auto watch every " + st.auto_ad_seconds + "s"}</button>` : ""}
      ${full ? `<p class="sm mut" style="margin:8px 0 0">Daily ad limit reached. Come back tomorrow.</p>` : ""}
    </div>
    ${sp && sp.enabled ? `<div class="card"><div class="row"><div class="sp"><h3 style="margin:0">🎰 Lucky Spin</h3>
      <div class="sm mut">${sp.available} spin(s) available. Watch ads to unlock more.</div></div>
      <button class="btn small" data-a="spin" ${sp.available < 1 ? "disabled" : ""}>Spin</button></div></div>` : ""}
    ${feed ? `<div class="card"><h3>✅ Recent payouts</h3>${feed}</div>` : ""}`;
};
A.banner = (v, el) => { api("/banners/" + v + "/click", {}); openLink(el.dataset.u); };

/* ---- ads ---- */
let monetagLoaded = "";
function loadMonetag(zone) {
  return new Promise((resolve, reject) => {
    const fn = "show_" + zone;
    if (typeof window[fn] === "function") return resolve(window[fn]);
    if (monetagLoaded !== zone) {
      monetagLoaded = zone;
      const s = document.createElement("script");
      s.src = "https://libtl.com/sdk.js";
      s.dataset.zone = zone; s.dataset.sdk = fn;
      s.onerror = () => reject(new Error("Ad network blocked."));
      document.head.appendChild(s);
    }
    let n = 0;
    const t = setInterval(() => {
      if (typeof window[fn] === "function") { clearInterval(t); resolve(window[fn]); }
      else if (++n > 40) { clearInterval(t); reject(new Error("Ad is not ready. Try again.")); }
    }, 150);
  });
}
async function showAd(provider) {
  if (provider === "monetag") {
    const zone = (S.me.monetag || {}).zoneId;
    if (!zone) throw new Error("Ad 2 is not configured.");
    const fn = await loadMonetag(zone);
    await fn();
    return;
  }
  const blockId = (S.me.adsgram || {}).blockId;
  if (!window.Adsgram) throw new Error("Ad network blocked.");
  const ctrl = window.Adsgram.init({ blockId: String(blockId) });
  const res = await ctrl.show();
  if (res && res.done === false) throw new Error("Watch the whole ad to earn.");
}
async function claimAd(provider) {
  const key = uid();
  for (let i = 0; i < 14; i++) {
    const r = await api("/ad-reward", { provider, rewardKey: key });
    if (r.ok) return r;
    if (r.pending) { await sleep(1500); continue; }
    return r;
  }
  return { ok: false, error: "Ad was not confirmed. Try again." };
}
A.watch = provider => lock("ad", async () => {
  if (S.adLock) return;
  S.adLock = true;
  try {
    await showAd(provider);
  } catch (e) {
    S.adLock = false;
    const m = (e && (e.message || e.description)) || "Ad not available right now.";
    toast(m, "err");
    return false;
  }
  toast("Checking your reward...");
  const r = await claimAd(provider);
  S.adLock = false;
  if (r.ok) {
    S.me.today_ads = (S.me.today_ads || 0) + 1;
    S.me.user.ads_count = r.user.ads_count; S.me.user.total_ads = r.user.total_ads;
    setPoints(r.user.points);
    haptic("success"); toast("+" + num(r.reward) + " points!", "ok");
    if (S.tab === "home") render();
    return true;
  }
  haptic("error"); toast(r.error || "Reward failed.", "err");
  return false;
});
A.auto = () => {
  S.auto = !S.auto;
  clearTimeout(S.autoTimer);
  if (S.auto) autoStep();
  render();
};
async function autoStep() {
  if (!S.auto) return;
  const max = settings().max_ads_per_day || 0;
  if (max && (S.me.today_ads || 0) >= max) { S.auto = false; render(); return; }
  if (S.tab === "home" && !document.hidden) {
    const ok = await A.watch("adsgram");
    if (!ok) { S.auto = false; render(); return; }
  }
  S.autoTimer = setTimeout(autoStep, Math.max(10, settings().auto_ad_seconds || 30) * 1000);
}

/* ---- spin ---- */
A.spin = () => lock("spin", async () => {
  const prizes = (S.d.spin && S.d.spin.prizes) || [1, 2, 5];
  modal(`<h3 style="text-align:center">🎰 Lucky Spin</h3><div class="slot" id="slot">🎁</div><div class="center" style="padding:0" id="spinMsg"><p class="mut">Spinning...</p></div>`);
  let i = 0;
  const anim = setInterval(() => { const s = $("#slot"); if (s) s.textContent = "+" + prizes[i++ % prizes.length]; }, 90);
  const [r] = await Promise.all([api("/spin", {}), sleep(1600)]);
  clearInterval(anim);
  const s = $("#slot"), m = $("#spinMsg");
  if (!s) return;
  if (r.ok) {
    s.textContent = "🎉 +" + num(r.prize, 4);
    m.innerHTML = `<p>You won <b>${num(r.prize, 4)}</b> points!</p><button class="btn full" data-a="closeModal">Great</button>`;
    haptic("success");
    await reloadMe();
    const sp = await api("/spin"); if (sp.ok) S.d.spin = sp;
    if (S.tab === "home") render();
  } else {
    s.textContent = "😕";
    m.innerHTML = `<p class="mut">${esc(r.error || "Spin failed.")}</p><button class="btn full" data-a="closeModal">OK</button>`;
  }
});

/* ============================ EARN ============================ */
loaders.earn = async () => {
  const [t, o, m] = await Promise.all([api("/tasks"), api("/offers"), api("/promote/mine")]);
  S.d.tasks = t.ok ? t.tasks : [];
  S.d.offers = o.ok ? o.offers : [];
  S.d.mine = m.ok ? m.campaigns : [];
  if (S.tab === "earn") render();
};
views.earn = () => {
  const st = settings();
  const tasks = (S.d.tasks || []).map(t => `<div class="item"><div class="sp"><b>${esc(t.title)}</b>${t.sponsored ? ` <span class="tag warn">Sponsored</span>` : ""}
      <div class="sm mut">${esc(t.description || "")}</div></div>
      <div style="text-align:right"><div class="tag ok">+${num(t.reward, 4)}</div><div style="height:6px"></div>

  } else if (t === "promos") {
    const list = (D.promos || []).map(p => `<div class="item"><div class="sp"><b class="mono">${esc(p.code)}</b><div class="sm mut">+${num(p.reward, 4)} · ${p.used_count} / ${p.max_uses}</div></div>
      <button class="btn ghost small" data-a="postPromo" data-v="${esc(p.code)}">📢</button><button class="btn bad small" data-a="del" data-v="/admin/promos/${encodeURIComponent(p.code)}/delete">🗑</button></div>`).join("");
    body = `<div class="card"><h3>New promo code</h3><input id="pc" placeholder="Code (empty = random)" autocapitalize="characters"><input id="pr" type="number" step="any" placeholder="Reward points">
      <input id="pm" type="number" placeholder="Number of people"><button class="btn full" data-a="addPromo">Create</button></div><div class="card">${D.promos ? (list || `<p class="mut sm">No codes.</p>`) : spin}</div>`;
  } else if (t === "banners") {
    const list = (D.abanners || []).map(b => `<div class="item"><div class="sp"><b>${esc(b.title)}</b><div class="sm mut">${b.clicks} clicks · ${b.live ? "live" : "ended"}</div></div>
      <button class="btn bad small" data-a="del" data-v="/admin/banners/${b.id}/delete">🗑</button></div>`).join("");
    body = `<div class="card"><h3>New banner</h3><input id="bt" placeholder="Title"><input id="bx" placeholder="Text"><input id="bu" placeholder="Link (https://...)">
      <input id="bd" type="number" placeholder="Days (0 = no end)"><button class="btn full" data-a="addBanner">Add</button></div><div class="card">${D.abanners ? (list || `<p class="mut sm">No banners.</p>`) : spin}</div>`;
  } else if (t === "offers") {
    const list = (D.aoffers || []).map(o => `<div class="item"><div class="sp"><b>${esc(o.title)}</b><div class="sm mut">+${num(o.reward, 2)} · ${o.done} done</div></div>
      <button class="btn bad small" data-a="del" data-v="/admin/offers/${o.id}/delete">🗑</button></div>`).join("");
    body = `<div class="card"><h3>New offer</h3><input id="ot" placeholder="Title"><input id="od" placeholder="Description"><input id="ou" placeholder="Link (use {userid})">
      <input id="or" type="number" step="any" placeholder="Reward points"><input id="ob" placeholder="Badge (optional)"><button class="btn full" data-a="addOffer">Add</button></div>
      <div class="card">${D.aoffers ? (list || `<p class="mut sm">No offers.</p>`) : spin}</div>`;
  } else if (t === "rewards") {
    const list = (D.arewards || []).map(x => `<div class="item"><div class="rk">${x.position}</div><div class="sp"><b>${esc(x.title)}</b><div class="sm mut">${esc(x.description || "")}</div></div></div>`).join("");
    body = `<div class="card"><h3>Set leaderboard reward</h3><input id="rp" type="number" placeholder="Position (1-30)"><input id="rt" placeholder="Title"><input id="rd" placeholder="Description">
      <label><input type="checkbox" id="re" checked style="width:auto;margin-right:6px">Enabled</label><button class="btn full" data-a="saveReward" style="margin-top:8px">Save</button></div>
      <div class="card">${D.arewards ? (list || `<p class="mut sm">No rewards.</p>`) : spin}</div>`;
  } else if (t === "bc") {
    body = `<div class="card"><h3>📣 Broadcast</h3><textarea id="bct" rows="5" maxlength="1000" placeholder="Message to all users"></textarea>
      <button class="btn full" data-a="broadcast" style="margin-top:8px">Send to everyone</button><div class="sm mut" id="bcs" style="margin-top:8px"></div></div>`;
  }
  return head + body;
};

A.wdFilter = v => { S.d.wdFilter = v; S.d.awd = null; render(); adminLoad(); };
A.wdApprove = id => lock("wd" + id, async () => {
  if (!(await confirmBox("Approve and pay request #" + id + "?"))) return;
  toast("Sending payment...");
  const r = await api("/admin/withdrawals/" + id + "/approve", {});
  if (!r.ok) { haptic("error"); toast(r.error || "Approve failed.", "err"); }
  else { haptic("success"); toast("Approved", "ok"); }
  adminLoad();
});
A.wdReject = id => lock("wd" + id, async () => {
  const note = window.prompt("Reason (optional):", "Rejected by admin");
  if (note === null) return;
  const r = await api("/admin/withdrawals/" + id + "/reject", { note });
  toast(r.ok ? "Rejected, points returned." : (r.error || "Reject failed."), r.ok ? "ok" : "err");
  adminLoad();
});
A.usearch = () => { S.d.uq = val("uq"); S.d.users = null; render(); adminLoad(); };
A.ban = (id, el) => lock("ban" + id, async () => {
  const banned = el.dataset.b === "1";
  if (!(await confirmBox((banned ? "Ban " : "Unban ") + id + "?"))) return;
  const r = await api("/admin/users/" + id + "/ban", { banned });
  toast(r.ok ? (banned ? "Banned" : "Unbanned") : (r.error || "Failed."), r.ok ? "ok" : "err");
  adminLoad();
});
A.pointsBox = id => modal(`<h3>± Points for ${esc(id)}</h3><input id="pamt" type="number" step="any" placeholder="e.g. 50 or -50">
  <div class="grid2" style="margin-top:8px"><button class="btn ghost" data-a="closeModal">Cancel</button><button class="btn" data-a="pointsSave" data-v="${esc(id)}">Apply</button></div>`);
A.pointsSave = id => lock("pts", async () => {
  const amount = Number(val("pamt"));
  const r = await api("/admin/users/" + id + "/points", { amount });
  if (!r.ok) return toast(r.error || "Failed.", "err");
  A.closeModal(); toast("New balance: " + num(r.points), "ok"); adminLoad();
});
A.saveSettings = () => lock("set", async () => {
  const body = {};
  document.querySelectorAll("[data-set]").forEach(i => { if (i.value !== "") body[i.dataset.set] = Number(i.value); });
  const c = val("wclose");
  if (c) body.withdraw_closed_until = Math.floor(new Date(c + "T23:59:59").getTime() / 1000);
  const r = await api("/admin/settings", body);
  if (!r.ok) return toast(r.error || "Failed.", "err");
  const f = {};
  ["spin_enabled", "spin_max_extra", "spin_scale", "promo_price_per_join", "promo_user_share", "promo_min_joins", "remind_enabled"].forEach(k => { if (body[k] !== undefined) f[k] = body[k]; });
  const r2 = await api("/admin/feature-settings", f);
  if (!r2.ok) return toast(r2.error || "Failed.", "err");
  await reloadMe(); toast("Settings saved", "ok"); render();
});
A.openWd = () => lock("set", async () => {
  const r = await api("/admin/settings", { withdraw_closed_until: 0 });
  toast(r.ok ? "Withdrawals are open." : (r.error || "Failed."), r.ok ? "ok" : "err");
  await reloadMe(); render();
});
A.del = path => lock("del" + path, async () => {
  if (!(await confirmBox("Delete this item?"))) return;
  const r = await api(path, {});
  toast(r.ok ? "Deleted" : (r.error || "Failed."), r.ok ? "ok" : "err");
  adminLoad();
});
async function adminAdd(path, body, clear) {
  const r = await api(path, body);
  if (!r.ok) return toast(r.error || "Failed.", "err");
  clear.forEach(i => { const e = document.getElementById(i); if (e) e.value = ""; });
  toast("Added", "ok"); adminLoad();
  return r;
}
A.addTask = () => lock("add", () => adminAdd("/admin/tasks", { title: val("tt"), description: val("td"), url: val("tu"), channel: val("tc"), reward: Number(val("tr")), max_users: Number(val("tm") || 0) }, ["tt", "td", "tu", "tc", "tr", "tm"]));
A.addPromo = () => lock("add", () => adminAdd("/admin/promos", { code: val("pc"), reward: Number(val("pr")), maxUses: Number(val("pm")) }, ["pc", "pr", "pm"]));
A.addBanner = () => lock("add", () => adminAdd("/admin/banners", { title: val("bt"), text: val("bx"), url: val("bu"), days: Number(val("bd") || 0) }, ["bt", "bx", "bu", "bd"]));
A.addOffer = () => lock("add", () => adminAdd("/admin/offers", { title: val("ot"), description: val("od"), url: val("ou"), reward: Number(val("or")), badge: val("ob") }, ["ot", "od", "ou", "or", "ob"]));
A.saveReward = () => lock("add", async () => {
  const r = await api("/admin/reward", { position: Number(val("rp")), title: val("rt"), description: val("rd"), enabled: !!($("#re") && $("#re").checked) });
  if (!r.ok) return toast(r.error || "Failed.", "err");
  toast("Saved", "ok"); adminLoad();
});
A.postPromo = code => lock("post" + code, async () => {
  const r = await api("/admin/promos/" + encodeURIComponent(code) + "/post", {});
  toast(r.ok ? "Posted to channel" : (r.error || "Failed."), r.ok ? "ok" : "err");
});
A.remind = () => lock("remind", async () => {
  toast("Sending reminders...");
  const r = await api("/admin/reminders/run", {});
  toast(r.ok ? (r.off ? "Reminders are off." : `Sent ${r.sent}, remaining ${r.remaining}`) : (r.error || "Failed."), r.ok ? "ok" : "err");
});
A.broadcast = () => lock("bc", async () => {
  const text = val("bct");
  if (!text) return toast("Write a message.", "err");
  if (!(await confirmBox("Send this message to all users?"))) return;
  const s = $("#bcs");
  let r = await api("/admin/broadcast", { text });
  if (!r.ok) return toast(r.error || "Failed.", "err");
  let sent = r.sent, failed = r.failed;
  while (r.ok && r.remaining > 0) {
    if (s) s.textContent = `Sent ${sent}, failed ${failed}, remaining ${r.remaining}...`;
    r = await api("/admin/broadcast/" + r.id + "/continue", {});
    if (r.ok) { sent += r.sent; failed += r.failed; }
  }
  if (s) s.textContent = `Done. Sent ${sent}, failed ${failed}.`;
  haptic("success"); toast("Broadcast finished", "ok");
});

/* ============================ START ============================ */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.me && S.tab === "wallet") reloadMe().then(() => render());
});
boot();
</script>
</body>
</html>
